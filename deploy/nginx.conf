server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml;

    gzip_min_length 1024;


    ############################
    # React frontend
    ############################

    location / {
        try_files $uri $uri/ /index.html;
    }


    ############################
    # React static assets
    ############################

    location /static/ {
        alias /var/www/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }


    ############################
    # Django static files
    ############################

    location /static/admin/ {
        alias /app/staticfiles/admin/;
        expires 30d;
    }

    location /static/rest_framework/ {
        alias /app/staticfiles/rest_framework/;
        expires 30d;
    }


    ############################
    # Django media/uploads
    ############################

    location /media/ {
        alias /app/media/;
        expires 7d;
    }


    ############################
    # Django API
    ############################

    location /api/ {

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve the HTTPS protocol forwarded by Traefik so Django can
        # build correct secure URLs and redirect to https. Do NOT replace it
        # with $scheme, which would read http here since Nginx talks HTTP.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header Connection "";

        # SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }


    ############################
    # Django Admin
    ############################

    location /admin/ {

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }


    ############################
    # Health check
    ############################

    location = /healthz {

        access_log off;

        default_type text/plain;

        return 200 "ok\n";
    }
}
